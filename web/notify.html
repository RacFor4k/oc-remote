<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oc-remote notifications</title>
<link rel="stylesheet" href="/_ocr/panel.css">
</head>
<body>
<main id="app">
  <header><h1>Notifications</h1></header>
  <section class="card">
    <p>Push notifications for permission requests. On iPhone, add this site to
    the home screen first, then open it from there.</p>
  </section>
  <section class="actions">
    <button id="enable">Enable notifications</button>
    <button id="back" class="ghost">Back</button>
  </section>
  <p id="msg" class="muted"></p>
</main>
<script src="/_ocr/notify.js"></script>
</body>
</html>
