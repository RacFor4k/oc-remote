<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oc-remote</title>
<link rel="stylesheet" href="/_ocr/panel.css">
</head>
<body>
<main id="app">
  <header>
    <h1>oc-remote</h1>
    <button id="close" class="ghost" hidden>Close</button>
  </header>

  <section id="status" class="card">
    <p class="muted">Loading…</p>
  </section>

  <section class="actions">
    <button id="pair">Connect device</button>
    <button id="push" class="ghost">Enable notifications</button>
    <button id="logout" class="danger">Sign out everywhere</button>
  </section>

  <section id="link" class="card" hidden>
    <label>Pair link <span id="expiry" class="muted"></span></label>
    <div class="row">
      <input id="url" readonly>
      <button id="copy" class="ghost">Copy</button>
    </div>
    <p class="muted">Single use. The phone must open it within 5 minutes.</p>
  </section>

  <section id="agent" class="card" hidden>
    <label for="agentSelect">Agent for this session</label>
    <select id="agentSelect"></select>
  </section>

  <p id="msg" class="muted"></p>
</main>
<script src="/_ocr/panel.js"></script>
</body>
</html>
